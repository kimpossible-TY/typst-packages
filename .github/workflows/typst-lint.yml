name: Typst linter tests

on:
  pull_request:
    paths:
      - 'tools/typst-lint/**'
      - 'openspec/changes/typst-style-linter/**'
      - '.github/workflows/typst-lint.yml'
  push:
    branches: [main]
    paths:
      - 'tools/typst-lint/**'
      - 'openspec/changes/typst-style-linter/**'
      - '.github/workflows/typst-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typst-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_shards:
    name: Python ${{ matrix.python }} shard ${{ matrix.shard }}/4 and pinned Typst syntax
    runs-on: ubuntu-latest
    # Partition whole modules without relaxing any test or compiler deadline.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
        shard: [1, 2, 3, 4]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENSPEC_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check and build syntax adapter
        working-directory: tools/typst-lint/syntax-adapter
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
          cargo build --locked
          test -x target/debug/typst-lint-syntax
      - name: Test linter components and real parser
        run: python tools/typst-lint/run_test_shard.py --shard-index ${{ matrix.shard }} --shard-count 4
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  test:
    # Retain both existing check names. Neither gate may pass unless every
    # interpreter/shard succeeded, including when a dependency failed or skipped.
    name: Python ${{ matrix.python }} and pinned Typst syntax
    if: ${{ always() }}
    needs: [test_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - name: Require all test shards to succeed
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "Test shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi
