name: Typst linter tests

on:
  pull_request:
    paths:
      - 'tools/typst-lint/**'
      - 'openspec/changes/typst-style-linter/**'
      - '.github/workflows/typst-lint.yml'
  push:
    branches: [main]
    paths:
      - 'tools/typst-lint/**'
      - 'openspec/changes/typst-style-linter/**'
      - '.github/workflows/typst-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typst-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} and pinned Typst syntax
    runs-on: ubuntu-latest
    # Full subprocess/crash-recovery suite needs headroom within the CI job budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENSPEC_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check and build syntax adapter
        working-directory: tools/typst-lint/syntax-adapter
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
          cargo build --locked
          test -x target/debug/typst-lint-syntax
      - name: Test linter components and real parser
        run: python -m unittest discover -s tools/typst-lint/tests -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
